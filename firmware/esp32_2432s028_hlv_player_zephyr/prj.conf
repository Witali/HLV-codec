# Run Zephyr as a two-core microkernel and allow explicit thread affinity.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_THREAD_NAME=y

# Zephyr's speed preset is -O2. The custom option is appended to every
# compilation unit, including the kernel, and deliberately raises it to -O3.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-O3"

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255

# The ESP32-2432S028 has no external PSRAM despite the DevKitC board model.
CONFIG_ESP_SPIRAM=n

# Keep the initial profile focused on scheduling, storage, decode and render.
CONFIG_WIFI=n
CONFIG_BT=n
