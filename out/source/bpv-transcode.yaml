    targetPsnrDb: 40
    toleranceDb: 0.10
    resizeMode: Crop
    audio: true
    threads: 6
    gop: 48
    minGop: 12
    sceneThreshold: 0.35
    candidatePalettes: 8
    samplesPerFrame: 256
    activePalettes: true

