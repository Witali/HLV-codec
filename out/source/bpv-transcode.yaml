# BPV1 v6 transcoding profiles.
# Paths are resolved relative to this YAML file.
version: 1
outputDirectory: ../BPV
summaryFile: ../BPV/BPVv6_yaml_summary.json

videos:
  - name: Danila
    input: ../sources/VID_20260522_181611.mp4
    width: 320
    height: 180
    fps: 30
    format: bpv1
    codec: BPVv6
    targetPsnrDb: 35
    toleranceDb: 0.10
    resizeMode: Stretch
    audio: true
    threads: 8
    gop: 48
    candidatePalettes: 3
    activePalettes: true

  - name: Danila
    input: ../sources/VID_20260522_181611.mp4
    width: 320
    height: 240
    fps: 30
    format: bpv1
    codec: BPVv6
    targetPsnrDb: 35
    toleranceDb: 0.10
    resizeMode: Crop
    audio: true
    threads: 8
    gop: 48
    candidatePalettes: 3
    activePalettes: true
