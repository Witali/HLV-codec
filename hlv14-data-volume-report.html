.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

.form-range {

  border: 0;

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);

  border-color: var(--ring);

t;all&quot;:7,&quot;key&quot;:0,&quot;p&quot;:7}],&quot;averageFileBitrate&quot;:1587201.6989172196,&quot;averageVideoBitrate&quot;:1455361.3278379322,&quot;averageAudioBitrate&quot;:127999.9955291652,&quot;peakSecondVideoBytes&quot;:806301}}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;hlv14-block-report&quot;);
      const data = JSON.parse(root.querySelector(&quot;#hlv14-report-data&quot;).textContent);
      const names = data.modeNames;
      const shortNames = [&quot;S&quot;, &quot;I&quot;, &quot;F&quot;, &quot;N&quot;, &quot;X&quot;, &quot;G&quot;, &quot;P&quot;, &quot;D&quot;, &quot;L&quot;];
      const colors = names.map((_, index) =&gt; `var(--m${index})`);
      const formatNumber = value =&gt; new Intl.NumberFormat(&quot;ru-RU&quot;).format(value);
      const formatPercent = value =&gt; `${value.toLocaleString(&quot;ru-RU&quot;, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}%`;
      const formatTime = seconds =&gt; {
        const whole = Math.floor(seconds);
        const minutes = Math.floor(whole / 60);
        const rest = whole % 60;
        return `${String(minutes).padStart(2, &quot;0&quot;)}:${String(rest).padStart(2, &quot;0&quot;)}`;
      };
      const formatBytes = value =&gt; {
        const units = [&quot;Б&quot;, &quot;КБ&quot;, &quot;МБ&quot;, &quot;ГБ&quot;];
        let amount = value;
        let unit = 0;
        while (amount &gt;= 1000 &amp;&amp; unit &lt; units.length - 1) {
          amount /= 1000;
          unit++;
        }
        return `${amount.toLocaleString(&quot;ru-RU&quot;, {
          minimumFractionDigits: unit &gt;= 2 ? 1 : 0,
          maximumFractionDigits: 1
        })} ${units[unit]}`;
      };
      const svgElement = (name, attributes = {}) =&gt; {
        const element = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, name);
        Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, value));
        return element;
      };

      root.querySelector(&quot;#stat-frames&quot;).textContent = formatNumber(data.frameCount);
      root.querySelector(&quot;#stat-duration&quot;).textContent =
        `${formatTime(data.durationSeconds)} · ${data.header.fpsNum}/${data.header.fpsDen} fps`;
      root.querySelector(&quot;#stat-macroblocks&quot;).textContent = formatNumber(data.totalMacroblocks);
      root.querySelector(&quot;#stat-geometry&quot;).textContent =
        `${data.geometry.mbCols}×${data.geometry.mbRows} на кадр`;
      root.querySelector(&quot;#stat-size&quot;).textContent = formatBytes(data.fileBytes);
      root.querySelector(&quot;#stat-stream&quot;).textContent =
        `${formatBytes(data.totals.videoBytes)} видео · ${formatBytes(data.totals.audioBytes)} аудио`;

      const volume = data.volume;
      const fileVolumeSvg = root.querySelector(&quot;#file-volume-chart&quot;);
      const fileParts = [
        { label: &quot;Видеоданные&quot;, value: volume.videoPayloadBytes, color: &quot;var(--viz-series-1)&quot; },
        { label: &quot;PCM_U8-аудио&quot;, value: volume.audioPayloadBytes, color: &quot;var(--viz-series-2)&quot; },
        { label: &quot;Заголовки FRM1&quot;, value: volume.packetHeaderBytes, color: &quot;var(--viz-series-3)&quot; },
        { label: &quot;Заголовок HLV1&quot;, value: volume.fileHeaderBytes, color: &quot;var(--viz-series-4)&quot; }
      ];
      const filePlot = { x: 42, y: 12, width: 678, height: 32 };
      let fileX = filePlot.x;
      fileParts.forEach(part =&gt; {
        const width = part.value / data.fileBytes * filePlot.width;
        fileVolumeSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: fileX, y: filePlot.y, width: Math.max(width, 0.15),
          height: filePlot.height, fill: part.color
        }));
        fileX += width;
      });
      const videoLabel = svgElement(&quot;text&quot;, {
        x: filePlot.x + 10, y: filePlot.y + 21, class: &quot;text-small&quot;
      });
      videoLabel.textContent =
        `Видео ${formatPercent(volume.videoPayloadBytes / data.fileBytes * 100)}`;
      fileVolumeSvg.appendChild(videoLabel);
      fileParts.forEach((part, index) =&gt; {
        const y = 64 + index * 27;
        fileVolumeSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: 42, y: y - 11, width: 12, height: 12, rx: 2, fill: part.color
        }));
        const label = svgElement(&quot;text&quot;, { x: 63, y, class: &quot;text-small&quot; });
        label.textContent = part.label;
        fileVolumeSvg.appendChild(label);
        const value = svgElement(&quot;text&quot;, {
          x: 720, y, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;text-small&quot;
        });
        value.textContent =
          `${formatBytes(part.value)} · ${formatNumber(part.value)} Б · ` +
          formatPercent(part.value / data.fileBytes * 100);
        fileVolumeSvg.appendChild(value);
      });

      const modeVolumeSvg = root.querySelector(&quot;#mode-volume-chart&quot;);
      const modeVolumeMax = Math.max(...data.totals.modeBits);
      const modeVolumeLeft = 106;
      const modeVolumeWidth = 614;
      data.totals.modeBits.forEach((bits, index) =&gt; {
        const y = 10 + index * 34;
        const label = svgElement(&quot;text&quot;, { x: 98, y: y + 18, &quot;text-anchor&quot;: &quot;end&quot; });
        label.textContent = names[index];
        modeVolumeSvg.appendChild(label);
        modeVolumeSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: modeVolumeLeft, y, width: modeVolumeWidth, height: 23, rx: 3,
          fill: &quot;var(--muted)&quot;
        }));
        const width = bits / modeVolumeMax * modeVolumeWidth;
        modeVolumeSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: modeVolumeLeft, y, width, height: 23, rx: 3, fill: colors[index]
        }));
        const averageBytes =
          bits / 8 / data.totals.modes[index];
        const labelInside = width &gt; 285;
        const value = svgElement(&quot;text&quot;, {
          x: labelInside
            ? modeVolumeLeft + width - 8
            : modeVolumeLeft + Math.max(width, 4) + 7,
          y: y + 17,
          &quot;text-anchor&quot;: labelInside ? &quot;end&quot; : &quot;start&quot;,
          class: &quot;text-small&quot;
        });
        value.textContent =
          `${formatBytes(bits / 8)} · ` +
          `${formatPercent(bits / data.totals.bitLength * 100)} · ` +
          `${averageBytes.toLocaleString(&quot;ru-RU&quot;, {
            minimumFractionDigits: 1, maximumFractionDigits: 1
          })} Б/блок`;
        modeVolumeSvg.appendChild(value);
      });

      const frameSizeSvg = root.querySelector(&quot;#frame-size-chart&quot;);
      const frameHistogram = volume.histogram;
      const framePlot = { x: 48, y: 12, width: 672, height: 180 };
      const frameCountMax = Math.max(...frameHistogram.map(bin =&gt; bin.all));
      const frameSizeMax = frameHistogram[frameHistogram.length - 1].high;
      frameHistogram.forEach((bin, index) =&gt; {
        const width = framePlot.width / frameHistogram.length;
        const height = bin.all / frameCountMax * framePlot.height;
        frameSizeSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: framePlot.x + index * width + 1,
          y: framePlot.y + framePlot.height - height,
          width: Math.max(1, width - 2),
          height,
          fill: &quot;var(--viz-series-1)&quot;
        }));
      });
      [0, 0.5, 1].forEach(fraction =&gt; {
        const y = framePlot.y + (1 - fraction) * framePlot.height;
        frameSizeSvg.appendChild(svgElement(&quot;line&quot;, {
          x1: framePlot.x, x2: framePlot.x + framePlot.width,
          y1: y, y2: y, class: &quot;grid-line&quot;
        }));
        const label = svgElement(&quot;text&quot;, {
          x: framePlot.x - 7, y: y + 4, &quot;text-anchor&quot;: &quot;end&quot;,
          class: &quot;muted-label text-small&quot;
        });
        label.textContent = formatNumber(Math.round(frameCountMax * fraction));
        frameSizeSvg.appendChild(label);
      });
      [0, 0.25, 0.5, 0.75, 1].forEach(fraction =&gt; {
        const x = framePlot.x + fraction * framePlot.width;
        const label = svgElement(&quot;text&quot;, {
          x, y: 216,
          &quot;text-anchor&quot;: fraction === 0 ? &quot;start&quot; : fraction === 1 ? &quot;end&quot; : &quot;middle&quot;,
          class: &quot;muted-label text-small&quot;
        });
        label.textContent = formatBytes(frameSizeMax * fraction);
        frameSizeSvg.appendChild(label);
      });
      [
        { label: &quot;P50&quot;, value: volume.frameSizes.p50, y: 30 },
        { label: &quot;P95&quot;, value: volume.frameSizes.p95, y: 47 },
        { label: &quot;P99&quot;, value: volume.frameSizes.p99, y: 64 }
      ].forEach(markerItem =&gt; {
        const x = framePlot.x + markerItem.value / frameSizeMax * framePlot.width;
        frameSizeSvg.appendChild(svgElement(&quot;line&quot;, {
          x1: x, x2: x, y1: framePlot.y, y2: framePlot.y + framePlot.height,
          stroke: &quot;var(--foreground)&quot;, &quot;stroke-width&quot;: 1
        }));
        const label = svgElement(&quot;text&quot;, {
          x: x + 4, y: markerItem.y, class: &quot;text-small&quot;
        });
        label.textContent = `${markerItem.label} ${formatBytes(markerItem.value)}`;
        frameSizeSvg.appendChild(label);
      });
      root.querySelector(&quot;#frame-size-detail&quot;).textContent =
        `Минимум ${formatBytes(volume.frameSizes.min)} · ` +
        `среднее ${formatBytes(volume.frameSizes.mean)} · ` +
        `максимум ${formatBytes(volume.frameSizes.max)} · ` +
        `средний K ${formatBytes(volume.frameSizes.keyMean)} · ` +
        `средний P ${formatBytes(volume.frameSizes.pMean)}`;

      const bitrateSvg = root.querySelector(&quot;#bitrate-chart&quot;);
      const bitratePlot = { x: 50, y: 10, width: 670, height: 190 };
      const videoRates = data.bins.map(bin =&gt; bin.videoBytes * 8 / 1000);
      const fullRates = data.bins.map((bin, index) =&gt;
        (bin.videoBytes + bin.audioBytes + bin.frames * 20 + (index === 0 ? 28 : 0)) *
        8 / 1000
      );
      const bitrateMaximum =
        Math.ceil(Math.max(...fullRates) / 1000) * 1000;
      const ratePoints = rates =&gt; rates.map((rate, index) =&gt; {
        const x = bitratePlot.x +
          index / Math.max(1, rates.length - 1) * bitratePlot.width;
        const y = bitratePlot.y +
          (1 - rate / bitrateMaximum) * bitratePlot.height;
        return `${x},${y}`;
      }).join(&quot; &quot;);
      [0, 0.25, 0.5, 0.75, 1].forEach(fraction =&gt; {
        const y = bitratePlot.y + (1 - fraction) * bitratePlot.height;
        bitrateSvg.appendChild(svgElement(&quot;line&quot;, {
          x1: bitratePlot.x, x2: bitratePlot.x + bitratePlot.width,
          y1: y, y2: y, class: &quot;grid-line&quot;
        }));
        const label = svgElement(&quot;text&quot;, {
          x: bitratePlot.x - 7, y: y + 4, &quot;text-anchor&quot;: &quot;end&quot;,
          class: &quot;muted-label text-small&quot;
        });
        label.textContent = formatNumber(Math.round(bitrateMaximum * fraction));
        bitrateSvg.appendChild(label);
      });
      bitrateSvg.appendChild(svgElement(&quot;polyline&quot;, {
        points: ratePoints(fullRates),
        stroke: &quot;var(--viz-series-2)&quot;,
        class: &quot;chart-line&quot;
      }));
      bitrateSvg.appendChild(svgElement(&quot;polyline&quot;, {
        points: ratePoints(videoRates),
        stroke: &quot;var(--viz-series-1)&quot;,
        class: &quot;chart-line&quot;
      }));
      [0, 0.25, 0.5, 0.75, 1].forEach(fraction =&gt; {
        const x = bitratePlot.x + fraction * bitratePlot.width;
        const label = svgElement(&quot;text&quot;, {
          x, y: 221,
          &quot;text-anchor&quot;: fraction === 0 ? &quot;start&quot; : fraction === 1 ? &quot;end&quot; : &quot;middle&quot;,
          class: &quot;muted-label text-small&quot;
        });
        label.textContent = formatTime(data.durationSeconds * fraction);
        bitrateSvg.appendChild(label);
      });
      const bitrateMarker = svgElement(&quot;line&quot;, {
        x1: bitratePlot.x, x2: bitratePlot.x,
        y1: bitratePlot.y, y2: bitratePlot.y + bitratePlot.height,
        stroke: &quot;var(--foreground)&quot;, &quot;stroke-width&quot;: 1.5
      });
      bitrateSvg.appendChild(bitrateMarker);
      bitrateSvg.appendChild(svgElement(&quot;line&quot;, {
        x1: 575, x2: 600, y1: 235, y2: 235,
        stroke: &quot;var(--viz-series-2)&quot;, &quot;stroke-width&quot;: 2
      }));
      const fullLegend = svgElement(&quot;text&quot;, {
        x: 607, y: 239, class: &quot;text-small&quot;
      });
      fullLegend.textContent = &quot;полный&quot;;
      bitrateSvg.appendChild(fullLegend);
      bitrateSvg.appendChild(svgElement(&quot;line&quot;, {
        x1: 455, x2: 480, y1: 235, y2: 235,
        stroke: &quot;var(--viz-series-1)&quot;, &quot;stroke-width&quot;: 2
      }));
      const videoLegend = svgElement(&quot;text&quot;, {
        x: 487, y: 239, class: &quot;text-small&quot;
      });
      videoLegend.textContent = &quot;видео&quot;;
      bitrateSvg.appendChild(videoLegend);

      const modeSvg = root.querySelector(&quot;#mode-chart&quot;);
      const modeMax = Math.max(...data.totals.modes);
      const modeLeft = 106;
      const modeRight = 720;
      const modeWidth = modeRight - modeLeft;
      data.totals.modes.forEach((count, index) =&gt; {
        const y = 10 + index * 34;
        const label = svgElement(&quot;text&quot;, { x: 98, y: y + 18, &quot;text-anchor&quot;: &quot;end&quot; });
        label.textContent = names[index];
        modeSvg.appendChild(label);

        const background = svgElement(&quot;rect&quot;, {
          x: modeLeft, y, width: modeWidth, height: 23, rx: 3,
          fill: &quot;var(--muted)&quot;
        });
        modeSvg.appendChild(background);
        const width = count / modeMax * modeWidth;
        const bar = svgElement(&quot;rect&quot;, {
          x: modeLeft, y, width, height: 23, rx: 3, fill: colors[index]
        });
        modeSvg.appendChild(bar);

        const labelInside = width &gt; 210;
        const value = svgElement(&quot;text&quot;, {
          x: labelInside ? modeLeft + width - 8 : modeLeft + Math.max(width, 4) + 7,
          y: y + 17,
          &quot;text-anchor&quot;: labelInside ? &quot;end&quot; : &quot;start&quot;,
          class: &quot;text-small&quot;
        });
        const share = count / data.totalMacroblocks * 100;
        value.textContent = `${formatNumber(count)} · ${formatPercent(share)}`;
        modeSvg.appendChild(value);
      });

      const legend = root.querySelector(&quot;#mode-legend&quot;);
      names.forEach((name, index) =&gt; {
        const item = document.createElement(&quot;span&quot;);
        item.className = &quot;legend-item&quot;;
        const swatch = document.createElement(&quot;span&quot;);
        swatch.className = &quot;legend-swatch&quot;;
        swatch.style.setProperty(&quot;--swatch&quot;, colors[index]);
        const text = document.createElement(&quot;span&quot;);
        text.textContent = `${shortNames[index]} ${name}`;
        item.append(swatch, text);
        legend.appendChild(item);
      });

      const timelineSvg = root.querySelector(&quot;#timeline-chart&quot;);
      const plot = { x: 42, y: 10, width: 678, height: 205 };
      const cumulative = data.bins.map(bin =&gt; {
        const total = bin.modes.reduce((sum, value) =&gt; sum + value, 0);
        let sum = 0;
        return bin.modes.map(value =&gt; {
          const low = sum / total;
          sum += value;
          return [low, sum / total];
        });
      });
      for (let mode = 0; mode &lt; names.length; ++mode) {
        const top = [];
        const bottom = [];
        cumulative.forEach((levels, index) =&gt; {
          const x = plot.x + index / Math.max(1, cumulative.length - 1) * plot.width;
          top.push(`${x},${plot.y + (1 - levels[mode][1]) * plot.height}`);
          bottom.push(`${x},${plot.y + (1 - levels[mode][0]) * plot.height}`);
        });
        const polygon = svgElement(&quot;polygon&quot;, {
          points: [...top, ...bottom.reverse()].join(&quot; &quot;),
          fill: colors[mode]
        });
        timelineSvg.appendChild(polygon);
      }
      [0, 0.25, 0.5, 0.75, 1].forEach(fraction =&gt; {
        const y = plot.y + (1 - fraction) * plot.height;
        const line = svgElement(&quot;line&quot;, {
          x1: plot.x, x2: plot.x + plot.width, y1: y, y2: y, class: &quot;grid-line&quot;
        });
        timelineSvg.appendChild(line);
        const label = svgElement(&quot;text&quot;, {
          x: plot.x - 7, y: y + 4, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;muted-label text-small&quot;
        });
        label.textContent = `${fraction * 100}%`;
        timelineSvg.appendChild(label);
      });
      [0, 0.25, 0.5, 0.75, 1].forEach(fraction =&gt; {
        const x = plot.x + fraction * plot.width;
        const label = svgElement(&quot;text&quot;, {
          x, y: 237, &quot;text-anchor&quot;: fraction === 0 ? &quot;start&quot; : fraction === 1 ? &quot;end&quot; : &quot;middle&quot;,
          class: &quot;muted-label text-small&quot;
        });
        label.textContent = formatTime(data.durationSeconds * fraction);
        timelineSvg.appendChild(label);
      });
      const marker = svgElement(&quot;line&quot;, {
        x1: plot.x, x2: plot.x, y1: plot.y, y2: plot.y + plot.height,
        stroke: &quot;var(--foreground)&quot;, &quot;stroke-width&quot;: 1.5
      });
      timelineSvg.appendChild(marker);

      const map = root.querySelector(&quot;#block-map&quot;);
      const slider = root.querySelector(&quot;#frame-slider&quot;);
      const selectedTime = root.querySelector(&quot;#selected-time&quot;);
      const timelineDetail = root.querySelector(&quot;#timeline-detail&quot;);
      const mapDetail = root.querySelector(&quot;#map-detail&quot;);
      const bitrateDetail = root.querySelector(&quot;#bitrate-detail&quot;);
      slider.max = data.sampledFrames.length - 1;
      slider.value = Math.floor(data.sampledFrames.length / 2);
      let selectedCell = -1;
      const cells = [];
      for (let position = 0; position &lt; data.geometry.mbCols * data.geometry.mbRows; ++position) {
        const button = document.createElement(&quot;button&quot;);
        button.type = &quot;button&quot;;
        button.className = &quot;btn viz-tile block-cell&quot;;
        button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        button.addEventListener(&quot;click&quot;, () =&gt; {
          if (selectedCell &gt;= 0) cells[selectedCell].setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
          selectedCell = position;
          button.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
          updateMapDetail();
        });
        map.appendChild(button);
        cells.push(button);
      }

      const updateMapDetail = () =&gt; {
        const sample = data.sampledFrames[Number(slider.value)];
        if (selectedCell &lt; 0) {
          mapDetail.textContent =
            `Кадр ${formatNumber(sample.index)} · ${sample.type}-кадр · qY ${sample.qY}, qUV ${sample.qUV}`;
          return;
        }
        const row = Math.floor(selectedCell / data.geometry.mbCols);
        const column = selectedCell % data.geometry.mbCols;
        const mode = Number(sample.modes[selectedCell]);
        mapDetail.textContent =
          `Строка ${row + 1}, столбец ${column + 1} · пиксели (${column * 16}, ${row * 16}) · ${names[mode]}`;
      };

      const updateSelection = () =&gt; {
        const sampleIndex = Number(slider.value);
        const sample = data.sampledFrames[sampleIndex];
        const bin = data.bins[sampleIndex];
        selectedTime.textContent = `${formatTime(sample.second)} · кадр ${formatNumber(sample.index)}`;
        sample.modes.split(&quot;&quot;).forEach((modeText, position) =&gt; {
          const mode = Number(modeText);
          const row = Math.floor(position / data.geometry.mbCols);
          const column = position % data.geometry.mbCols;
          const cell = cells[position];
          cell.textContent = shortNames[mode];
          cell.style.setProperty(&quot;--cell-color&quot;, colors[mode]);
          cell.setAttribute(
            &quot;aria-label&quot;,
            `Строка ${row + 1}, столбец ${column + 1}, режим ${names[mode]}`
          );
        });
        marker.setAttribute(
          &quot;x1&quot;,
          plot.x + sampleIndex / Math.max(1, data.sampledFrames.length - 1) * plot.width
        );
        marker.setAttribute(
          &quot;x2&quot;,
          plot.x + sampleIndex / Math.max(1, data.sampledFrames.length - 1) * plot.width
        );
        const bitrateMarkerX = bitratePlot.x +
          sampleIndex / Math.max(1, data.sampledFrames.length - 1) * bitratePlot.width;
        bitrateMarker.setAttribute(&quot;x1&quot;, bitrateMarkerX);
        bitrateMarker.setAttribute(&quot;x2&quot;, bitrateMarkerX);
        bitrateDetail.textContent =
          `${formatTime(bin.second)} — видео ` +
          `${videoRates[sampleIndex].toLocaleString(&quot;ru-RU&quot;, {
            minimumFractionDigits: 1, maximumFractionDigits: 1
          })} кбит/с · полный ` +
          `${fullRates[sampleIndex].toLocaleString(&quot;ru-RU&quot;, {
            minimumFractionDigits: 1, maximumFractionDigits: 1
          })} кбит/с`;
        const total = bin.modes.reduce((sum, value) =&gt; sum + value, 0);
        const ranked = bin.modes
          .map((value, mode) =&gt; ({ mode, value }))
          .sort((a, b) =&gt; b.value - a.value)
          .slice(0, 3);
        timelineDetail.textContent =
          `${formatTime(bin.second)} — ` +
          ranked.map(item =&gt;
            `${names[item.mode]} ${formatPercent(item.value / total * 100)}`
          ).join(&quot; · &quot;);
        updateMapDetail();
      };
      slider.addEventListener(&quot;input&quot;, updateSelection);
      updateSelection();

      const residualSvg = root.querySelector(&quot;#residual-chart&quot;);
      const residual = data.totals.residual;
      const residualItems = [
        { label: &quot;Нулевой&quot;, value: residual.zero4x4, color: &quot;var(--m0)&quot; },
        { label: &quot;Только DC&quot;, value: residual.dcOnly4x4, color: &quot;var(--m5)&quot; },
        { label: &quot;Полный WHT&quot;, value: residual.wht4x4, color: &quot;var(--m1)&quot; }
      ];
      const residualMax = Math.max(...residualItems.map(item =&gt; item.value));
      residualItems.forEach((item, index) =&gt; {
        const y = 8 + index * 43;
        const label = svgElement(&quot;text&quot;, { x: 98, y: y + 21, &quot;text-anchor&quot;: &quot;end&quot; });
        label.textContent = item.label;
        residualSvg.appendChild(label);
        residualSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: 106, y, width: 614, height: 27, rx: 3, fill: &quot;var(--muted)&quot;
        }));
        const width = item.value / residualMax * 614;
        residualSvg.appendChild(svgElement(&quot;rect&quot;, {
          x: 106, y, width, height: 27, rx: 3, fill: item.color
        }));
        const labelInside = width &gt; 210;
        const value = svgElement(&quot;text&quot;, {
          x: labelInside ? 106 + width - 8 : 106 + Math.max(width, 4) + 7,
          y: y + 20,
          &quot;text-anchor&quot;: labelInside ? &quot;end&quot; : &quot;start&quot;,
          class: &quot;text-small&quot;
        });
        value.textContent =
          `${formatNumber(item.value)} · ${formatPercent(item.value / residual.total4x4 * 100)}`;
        residualSvg.appendChild(value);
      });

      const tableRows = [
        [&quot;K-кадры&quot;, data.totals.keyframes,
          formatPercent(data.totals.keyframes / data.frameCount * 100)],
        [&quot;P-кадры&quot;, data.frameCount - data.totals.keyframes,
          formatPercent((data.frameCount - data.totals.keyframes) / data.frameCount * 100)],
        [&quot;Палитра 2 цвета&quot;, data.totals.paletteSizes[&quot;2&quot;],
          &quot;из режима PALETTE&quot;],
        [&quot;Палитра 4 цвета&quot;, data.totals.paletteSizes[&quot;4&quot;],
          &quot;из режима PALETTE&quot;],
        [&quot;Палитра 8 цветов&quot;, data.totals.paletteSizes[&quot;8&quot;],
          &quot;из режима PALETTE&quot;],
        [&quot;Векторы движения&quot;, data.totals.vectors,
          `${formatNumber(data.totals.halfPixelVectors)} с half-pixel синтаксисом`],
        [&quot;Коэффициенты остатка&quot;, residual.coefficients,
          `${(residual.coefficients / residual.nonzero4x4).toLocaleString(&quot;ru-RU&quot;, {
            minimumFractionDigits: 2, maximumFractionDigits: 2
          })} на ненулевой блок 4×4`],
        [&quot;Нулевые наборы остатка&quot;, residual.zeroResidualSets,
          &quot;быстрый флаг полностью нулевого остатка&quot;],
        [&quot;Выравнивание макроблоков&quot;, data.totals.alignmentBits,
          `${formatBytes(data.totals.alignmentBits / 8)} в битовом эквиваленте`],
        [&quot;Управление на уровне кадров&quot;, data.totals.frameControlBits,
          `${formatBytes(data.totals.frameControlBits / 8)} в битовом эквиваленте`],
        [&quot;Дополнение последних байтов&quot;, volume.finalBytePaddingBits,
          `${formatBytes(volume.finalBytePaddingBits / 8)} вне bit_length`],
        [&quot;Средний видеобитрейт&quot;, Math.round(volume.averageVideoBitrate),
          &quot;бит/с&quot;],
        [&quot;Средний полный битрейт&quot;, Math.round(volume.averageFileBitrate),
          &quot;бит/с&quot;],
        [&quot;Пиковый секундный видеобитрейт&quot;, volume.peakSecondVideoBytes * 8,
          &quot;бит/с&quot;]
      ];
      const tbody = root.querySelector(&quot;#syntax-table&quot;);
      tableRows.forEach(([label, value, note]) =&gt; {
        const row = document.createElement(&quot;tr&quot;);
        const labelCell = document.createElement(&quot;td&quot;);
        labelCell.textContent = label;
        const valueCell = document.createElement(&quot;td&quot;);
        valueCell.className = &quot;text-end&quot;;
        valueCell.textContent = formatNumber(value);
        const noteCell = document.createElement(&quot;td&quot;);
        noteCell.textContent = note;
        row.append(labelCell, valueCell, noteCell);
        tbody.appendChild(row);
      });

      const leadingMode = data.totals.modes
        .map((value, mode) =&gt; ({ mode, value }))
        .sort((a, b) =&gt; b.value - a.value)[0];
      root.querySelector(&quot;#accessible-summary&quot;).textContent =
        `Проанализировано ${formatNumber(data.frameCount)} кадров и ` +
        `${formatNumber(data.totalMacroblocks)} макроблоков. Наиболее частый режим ` +
        `${names[leadingMode.mode]}: ${formatNumber(leadingMode.value)}, ` +
        `${formatPercent(leadingMode.value / data.totalMacroblocks * 100)}. ` +
        `Файл занимает ${formatBytes(data.fileBytes)}, средний полный битрейт ` +
        `${formatNumber(Math.round(volume.averageFileBitrate))} бит/с.`;
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
